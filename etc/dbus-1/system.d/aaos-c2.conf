<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Default-deny system bus policy for AAOS C2.

  Only user aaos-c2 may own org.akkay.AAOS and org.akkay.aaos.C2.
  Group aaos-ui may send GetState (and only that member) to org.akkay.AAOS.
  User aaos-agent may send Fetch1 methods to org.akkay.aaos.C2.
  Do not add eavesdrop="true". Do not enable units from this tree.
-->
<busconfig>
  <policy context="default">
    <deny own="org.akkay.AAOS"/>
    <deny send_destination="org.akkay.AAOS"/>
    <deny send_interface="org.akkay.AAOS"/>
    <deny receive_sender="org.akkay.AAOS"/>
    <deny own="org.akkay.aaos.C2"/>
    <deny send_destination="org.akkay.aaos.C2"/>
    <deny send_interface="org.akkay.aaos.C2"/>
    <deny receive_sender="org.akkay.aaos.C2"/>
  </policy>

  <policy user="aaos-c2">
    <allow own="org.akkay.AAOS"/>
    <allow own="org.akkay.aaos.C2"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus"/>
  </policy>

  <policy group="aaos-ui">
    <allow send_destination="org.akkay.AAOS"
           send_interface="org.akkay.AAOS"
           send_member="GetState"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus"/>
  </policy>

  <policy user="aaos-agent">
    <allow send_destination="org.akkay.aaos.C2"
           send_interface="org.akkay.aaos.C2.Fetch1"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus"/>
  </policy>
</busconfig>
