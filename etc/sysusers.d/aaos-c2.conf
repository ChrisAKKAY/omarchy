# Dedicated non-root identity for aaos-c2.service. No login shell.
# aaos-agent is the D-Bus caller identity for Fetch1; g lines cannot carry a GECOS field.
u aaos-c2 - "AAOS C2 daemon" /var/empty /usr/bin/nologin
u aaos-agent - "AAOS sandbox agent" /var/empty /usr/bin/nologin
g aaos-ui -
m aaos-c2 aaos-ui
