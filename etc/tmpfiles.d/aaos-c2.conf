# Fail-closed compartments. Mode 0700: only aaos-c2 may read or write.
# /knowledge is the FUSE backing store. Do not stub an empty tree here.
d /store        0700 aaos-c2 aaos-c2 -
d /traces       0700 aaos-c2 aaos-c2 -
d /opt/aaos     0755 root    root    -
d /mnt/aaos      0755 root    root    -
d /mnt/aaos/fuse 0755 aaos-c2 aaos-c2 -
